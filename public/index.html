<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7cc4ff">
<!-- Opened from the Home Screen, the game fills the whole screen, even on iPhones. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kids World">
<meta name="description" content="Kids World: build a happy island of toy bricks with your friends, right in the browser.">
<title>Kids World</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script src="vendor/peerjs.min.js" defer></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<canvas id="world" aria-label="Your island"></canvas>
<div id="joystick" aria-hidden="true"><div class="knob"></div></div>

<section id="title" class="screen" hidden>
  <div class="title-top">
  <h1 class="logo" aria-label="Kids World"><span>K</span><span>i</span><span>d</span><span>s</span> <span>W</span><span>o</span><span>r</span><span>l</span><span>d</span></h1>
  <p class="tagline" id="tagline">Build a happy island with your friends!</p>
  <div class="me-row">
    <div class="me-name" id="me-name"></div>
    <button class="chip level-chip" id="btn-level" type="button"></button>
    <button class="chip" id="btn-me" type="button">🎨 Change me</button>
    <button class="chip" id="btn-pet" type="button">🐾 My pet</button>
    <button class="chip" id="btn-login" type="button" hidden>🔑 Log in</button>
  </div>
  </div>
  <div class="title-bottom">
  <!-- Nobody plays without logging in: until you do, this is all there is. -->
  <div class="login-gate" id="login-gate" hidden>
    <p class="tagline">Log in to play!</p>
    <div class="big-buttons gate-buttons">
      <button class="big green" id="gate-login" type="button"><span class="emoji">🔑</span> Log in</button>
      <button class="big blue" id="gate-make" type="button"><span class="emoji">✨</span> Make my login</button>
    </div>
    <p class="tagline gate-away" id="gate-away" hidden>Logging in needs the island keeper. It is not online yet — ask a grown-up to turn it on.</p>
  </div>
  <div class="tabs mode-switch" id="mode-switch" role="tablist" aria-label="Which world" hidden>
    <button class="chip" id="mode-build" type="button" role="tab">🧱 Build</button>
    <button class="chip" id="mode-adventure" type="button" role="tab">⚔️ Adventure</button>
  </div>
  <div class="big-buttons">
    <button class="big pink isle-button" id="btn-isle" type="button" hidden><span class="emoji">🌟</span> Adventure Isle</button>
    <button class="big green" id="btn-new" type="button"><span class="emoji">🏝️</span> Make an island</button>
    <button class="big blue" id="btn-visit" type="button"><span class="emoji">✈️</span> Visit a friend</button>
    <button class="big yellow" id="btn-mine" type="button"><span class="emoji">📒</span> My islands</button>
    <p class="tagline isle-away" id="isle-away" hidden>Adventure Isle opens when the island keeper is online.</p>
  </div>
  <div class="small-buttons">
    <button class="chip" id="btn-stickers" type="button">⭐ Stickers</button>
    <button class="chip" id="btn-shop" type="button">🛒 Shop</button>
    <button class="chip" id="btn-backpack" type="button">🎒 Backpack</button>
    <button class="chip" id="btn-ranking" type="button" hidden>🏆 Ranking</button>
    <button class="chip" id="btn-players" type="button" hidden>👫 Players</button>
    <button class="chip" id="btn-help" type="button">❓ How to play</button>
    <button class="chip" id="btn-news" type="button">📰 What's new</button>
    <button class="chip" id="btn-feedback" type="button" hidden>💌 Ideas &amp; problems</button>
    <button class="chip" id="btn-sound" type="button">🔊 Sound</button>
    <button class="chip" id="btn-fullscreen" type="button" hidden>Full screen</button>
  </div>
  </div>
</section>

<section id="hud" hidden>
  <div id="overlays" aria-hidden="true"></div>
  <header id="topbar">
    <button class="island-badge" id="island-badge" type="button">
      <span class="island-name" id="island-name"></span>
      <span class="island-line">
        <span class="island-stage" id="island-stage" hidden></span>
        <span class="island-code" id="island-code"></span>
      </span>
    </button>
    <div id="status" class="status"></div>
    <div id="friends" class="friends" aria-label="Who is here"></div>
    <div class="top-buttons">
      <span id="clock" class="clock" title="Time of day"></span>
      <button class="round" id="btn-view" type="button" aria-label="Change how you look">🎥</button>
      <button class="round" id="btn-photo" type="button" aria-label="Take a photo">📸</button>
      <button class="round level-ring" id="btn-stickers-hud" type="button" aria-label="Stickers">⭐<span class="level-pip" id="level-pip"></span></button>
      <button class="round" id="btn-shop-hud" type="button" aria-label="Shop">🛒</button>
      <button class="round" id="btn-backpack-hud" type="button" aria-label="Backpack" title="Backpack (I)">🎒</button>
      <button class="round" id="btn-help-hud" type="button" aria-label="How to play">❓</button>
      <button class="round" id="btn-feedback-hud" type="button" aria-label="Ideas and problems" title="An idea for the game, or something went wrong?" hidden>💌</button>
      <button class="round" id="btn-settings" type="button" aria-label="Settings">⚙️</button>
      <button class="round" id="btn-fullscreen-hud" type="button" aria-label="Full screen" hidden></button>
    </div>
  </header>

  <nav id="toolbar" aria-label="Tools"></nav>
  <div id="toolopts"></div>

  <div id="bottom">
    <div id="hideseek" class="hearts defense-bar hideseek-bar" role="status" hidden></div>
    <div id="defense" class="hearts defense-bar" role="img" hidden></div>
    <div class="hp-row" id="hp-row" hidden>
      <div id="hearts" class="hearts" role="img" hidden></div>
      <button id="btn-potion" class="potion-button" type="button" aria-label="Drink an HP potion" title="Drink an HP potion (Y)" hidden>🧪</button>
    </div>
    <div id="basket" class="basket" aria-label="Your basket"></div>
    <div class="hotrow">
      <div id="hotbar" aria-label="Your blocks"></div>
      <button class="slot toybox" id="btn-toybox" type="button" title="Toy box"><span class="emoji">🧸</span><span class="label">Toy box</span></button>
    </div>
  </div>

  <div id="talk">
    <button class="round big-round" id="btn-say" type="button" aria-label="Say something">💬</button>
    <button class="round big-round" id="btn-emote" type="button" aria-label="Emotes">😊</button>
  </div>

  <button id="minimap" type="button" aria-label="Island map" title="Island map"><canvas></canvas></button>

  <div id="touch-buttons">
    <button class="round touch attack" id="btn-attack" type="button" aria-label="Bop" hidden>👊</button>
    <button class="round touch weapon" id="btn-weapon" type="button" aria-label="Next toy weapon" title="Next toy weapon (N)" hidden>🗡️</button>
    <button class="round touch" id="btn-down" type="button" aria-label="Go down">⬇️</button>
    <button class="round touch" id="btn-fly" type="button" aria-label="Fly">🪽</button>
    <button class="round touch jump" id="btn-jump" type="button" aria-label="Jump">⤴️</button>
  </div>

  <div id="aim-hint" class="aim-hint" hidden></div>
  <button id="ride" class="ride-button" type="button" hidden></button>
  <button id="defend" class="ride-button defend-button" type="button" hidden></button>
  <button id="next-stage" class="ride-button next-stage" type="button" hidden></button>
  <div id="chatlog" class="chatlog" aria-live="polite"></div>
</section>

<div id="blindfold" class="blindfold" hidden><div class="blindfold-icon">🙈</div><div class="blindfold-count" id="blindfold-count"></div><div class="blindfold-text">Eyes shut! Counting while everyone hides…</div></div>
<div id="toasts" aria-live="polite"></div>
<div id="invitations" aria-live="polite"></div>
<div id="flash" hidden></div>

<div id="modal" class="modal" hidden>
  <div class="panel" role="dialog" aria-modal="true">
    <button class="close" id="modal-close" type="button" aria-label="Close">✖</button>
    <div id="modal-body"></div>
  </div>
</div>

<div id="loading" class="loading" hidden>
  <div class="spinner"><span>🧱</span></div>
  <p id="loading-text">Getting your island ready…</p>
  <button class="chip" id="loading-cancel" type="button" hidden>Go back</button>
</div>

<noscript><p class="noscript">Kids World needs JavaScript to play.</p></noscript>
</body>
</html>
