<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kids World · Keeper admin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <script src="/vendor/peerjs.min.js" defer></script>
    <script type="module" src="/admin/admin.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand"><h1>Keeper admin</h1><span class="muted">Kids World</span></div>
      <div id="status" class="status" role="status">Loading…</div>
    </header>
    <main>
      <section id="summary" class="summary" aria-label="Summary"></section>
      <section id="tv-section" hidden>
        <h2>TV broadcast</h2>
        <div id="tv" class="tv card"></div>
      </section>
      <section id="reports-section" hidden>
        <h2>Problem reports <span id="reports-count" class="badge"></span></h2>
        <div id="reports" class="reports"></div>
      </section>
      <section id="friend-section" hidden>
        <h2>AI friend</h2>
        <div id="friend" class="friend card"></div>
      </section>
      <section id="recent-section" hidden>
        <h2>Recent activity</h2>
        <ol id="recent" class="recent card"></ol>
      </section>
      <section>
        <h2>Players <span id="devices-count" class="badge"></span></h2>
        <div id="devices" class="devices"></div>
      </section>
    </main>
  </body>
</html>
