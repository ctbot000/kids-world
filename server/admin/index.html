<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kids World · Keeper admin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <script src="/vendor/peerjs.min.js" defer></script>
    <script src="/vendor/chart.umd.min.js" defer></script>
    <script type="module" src="/admin/admin.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand"><h1>Keeper admin</h1><span class="muted">Kids World</span></div>
      <div id="status" class="status" role="status">Loading…</div>
      <nav class="tabs" role="tablist" aria-label="Admin sections">
        <button type="button" role="tab" id="tab-overview" aria-controls="overview">Overview</button>
        <button type="button" role="tab" id="tab-players" aria-controls="players">Players <span id="devices-count" class="badge"></span></button>
        <button type="button" role="tab" id="tab-visitors" aria-controls="visitors-section">Visitors <span id="visitors-count" class="badge"></span></button>
        <button type="button" role="tab" id="tab-tv" aria-controls="tv-section" hidden>TV broadcast</button>
        <button type="button" role="tab" id="tab-friend" aria-controls="friend-section" hidden>AI friend</button>
        <button type="button" role="tab" id="tab-ctb" aria-controls="ctb-section" hidden>CTB <span id="ctb-reports-count" class="badge bad" hidden></span></button>
      </nav>
    </header>
    <main>
      <section id="overview" role="tabpanel" aria-labelledby="tab-overview">
        <div id="lock" class="lock card" aria-label="Screen time" hidden></div>
        <div id="summary" class="summary" aria-label="Summary"></div>
        <section id="recent-section" hidden>
          <h2>Recent activity</h2>
          <ol id="recent" class="recent card"></ol>
        </section>
      </section>
      <section id="players" role="tabpanel" aria-labelledby="tab-players">
        <div id="devices" class="devices"></div>
      </section>
      <section id="visitors-section" role="tabpanel" aria-labelledby="tab-visitors">
        <div id="visitors" class="visitors"></div>
      </section>
      <section id="tv-section" role="tabpanel" aria-labelledby="tab-tv" hidden>
        <div id="tv" class="tv card"></div>
      </section>
      <section id="friend-section" role="tabpanel" aria-labelledby="tab-friend" hidden>
        <div id="friend" class="friend card"></div>
      </section>
      <section id="ctb-section" role="tabpanel" aria-labelledby="tab-ctb" hidden>
        <nav class="tabs subtabs" role="tablist" aria-label="CTB parts">
          <button type="button" role="tab" id="tab-ctb-workers" aria-controls="ctb-workers">👷 Workers</button>
          <button type="button" role="tab" id="tab-ctb-tasks" aria-controls="ctb-tasks">📋 Tasks <span id="ctb-tasks-count" class="badge"></span></button>
          <button type="button" role="tab" id="tab-ctb-players" aria-controls="ctb-players">💌 From players <span id="ctb-players-count" class="badge bad" hidden></span></button>
          <button type="button" role="tab" id="tab-ctb-runs" aria-controls="ctb-models">🔍 Model runs</button>
          <button type="button" role="tab" id="tab-ctb-tokens" aria-controls="ctb-tokens">🪙 Tokens</button>
        </nav>
        <div id="ctb-workers" class="ctb" role="tabpanel" aria-labelledby="tab-ctb-workers" hidden></div>
        <div id="ctb-tasks" class="ctb" role="tabpanel" aria-labelledby="tab-ctb-tasks" hidden></div>
        <div id="ctb-players" class="ctb" role="tabpanel" aria-labelledby="tab-ctb-players" hidden>
          <section id="reports-section" class="card ctb-card reports-card" hidden>
            <h3>🐞 Problem reports <span id="reports-count" class="badge"></span></h3>
            <p class="muted">What players told of in the game. One in words goes to the workers too, beside the players’ ideas.</p>
            <div id="reports" class="reports"></div>
          </section>
        </div>
        <div id="ctb-models" class="ctb" role="tabpanel" aria-labelledby="tab-ctb-runs" hidden></div>
        <div id="ctb-tokens" class="ctb" role="tabpanel" aria-labelledby="tab-ctb-tokens" hidden></div>
      </section>
    </main>
  </body>
</html>
