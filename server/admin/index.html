<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kids World · Keeper admin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <script src="/vendor/peerjs.min.js" defer></script>
    <script type="module" src="/admin/admin.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand"><h1>Keeper admin</h1><span class="muted">Kids World</span></div>
      <div id="status" class="status" role="status">Loading…</div>
      <nav class="tabs" role="tablist" aria-label="Admin sections">
        <button type="button" role="tab" id="tab-overview" aria-controls="overview">Overview</button>
        <button type="button" role="tab" id="tab-players" aria-controls="players">Players <span id="devices-count" class="badge"></span></button>
        <button type="button" role="tab" id="tab-visitors" aria-controls="visitors-section">Visitors <span id="visitors-count" class="badge"></span></button>
        <button type="button" role="tab" id="tab-reports" aria-controls="reports-section" hidden>Problem reports <span id="reports-count" class="badge"></span></button>
        <button type="button" role="tab" id="tab-tv" aria-controls="tv-section" hidden>TV broadcast</button>
        <button type="button" role="tab" id="tab-friend" aria-controls="friend-section" hidden>AI friend</button>
        <button type="button" role="tab" id="tab-ctb" aria-controls="ctb-section" hidden>CTB</button>
      </nav>
    </header>
    <main>
      <section id="overview" role="tabpanel" aria-labelledby="tab-overview">
        <div id="summary" class="summary" aria-label="Summary"></div>
        <section id="recent-section" hidden>
          <h2>Recent activity</h2>
          <ol id="recent" class="recent card"></ol>
        </section>
      </section>
      <section id="players" role="tabpanel" aria-labelledby="tab-players">
        <div id="devices" class="devices"></div>
      </section>
      <section id="visitors-section" role="tabpanel" aria-labelledby="tab-visitors">
        <div id="visitors" class="visitors"></div>
      </section>
      <section id="reports-section" role="tabpanel" aria-labelledby="tab-reports" hidden>
        <div id="reports" class="reports"></div>
      </section>
      <section id="tv-section" role="tabpanel" aria-labelledby="tab-tv" hidden>
        <div id="tv" class="tv card"></div>
      </section>
      <section id="friend-section" role="tabpanel" aria-labelledby="tab-friend" hidden>
        <div id="friend" class="friend card"></div>
      </section>
      <section id="ctb-section" role="tabpanel" aria-labelledby="tab-ctb" hidden>
        <div id="ctb" class="ctb"></div>
      </section>
    </main>
  </body>
</html>
