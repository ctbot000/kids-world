<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Adventure Isle films</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      html, body { margin: 0; background: #000; overflow: hidden; }
      #world { display: block; }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <script type="module">
      // Loaded by make-films.mjs: the films, the stage and the score.
      const { films } = await import('./films.js');
      const stage = await import('./stage.js');
      const { score } = await import('./score.js');
      await document.fonts.load('600 32px Fredoka');
      await document.fonts.load('700 46px Fredoka');
      window.film = {
        // A film, with what its lines are like (voices.mjs), or with how long
        // each is guessed, for a first look at what is said in it.
        load(name, voices = null) {
          stage.useVoices(voices);
          stage.load(films[name]());
          return { length: stage.lengthOf() };
        },
        lines: () => stage.linesOf(),
        cues: () => stage.cuesOf(),
        length: () => stage.lengthOf(),
        poster: () => stage.posterOf(),
        frame: (t) => stage.frame(t),
        score: (name, secs) => score(name, secs, stage.cuesOf()),
      };
      window.filmReady = true;
    </script>
  </body>
</html>
