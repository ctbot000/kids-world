<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Adventure Isle films</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      html, body { margin: 0; background: #000; overflow: hidden; }
      #world { display: block; }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <script type="module">
      // Loaded by make-films.mjs: the films, the stage and the score.
      const { films } = await import('./films.js');
      const stage = await import('./stage.js');
      const { score } = await import('./score.js');
      await document.fonts.load('600 32px Fredoka');
      await document.fonts.load('700 46px Fredoka');
      window.film = {
        load(name) {
          stage.load(films[name]());
          return { length: films[name].length ?? null };
        },
        length: () => stage.lengthOf(),
        poster: () => stage.posterOf(),
        frame: (t) => stage.frame(t),
        score: (name, secs) => score(name, secs),
      };
      window.filmReady = true;
    </script>
  </body>
</html>
